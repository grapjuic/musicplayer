<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="music-player">
        <h2>Now Playing</h2>
        <div id="now-playing">
            <img id="album-cover" src="placeholder.jpg" alt="Album Cover">
            <p id="song-title">Not playing</p>
        </div>

    <!-- Music Controls -->
    <div class="controls">
        <button id="prev">⏮</button>
        <button id="play">▶️</button>
        <button id="pause" style="display: none;">⏸</button>
        <button id="next">⏭</button>
    </div>

    <!-- Song Progress Bar -->
    <div class="progress-container">
        <span id="current-time">0:00</span>
        <input type="range" id="progress-bar" value="0" min="0" max="100">
        <span id="total-time">0:00</span>
    </div>




        <!-- Navigation Buttons -->
        <div class="navigation">
            <button id="open-playlists">📜 Playlists</button>
            <button id="open-themes">🎨 Themes</button>
        </div>

        <!-- Connect to Spotify Button -->
        <button id="connect-spotify">🎵 Connect to Spotify</button>

        <!-- User Info -->
        <div id="user-info">Not connected</div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
