<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
    

<head>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Drag area styling */
        .drag-area {
            -webkit-app-region: drag;
            height: 30px;
            width: 100%;
            background-color: transparent;
        }
    </style>
</head>
<body>
    <!-- Custom Drag Area -->
    <div class="drag-area"></div>

    <div id="music-player">
        <div id="now-playing">
            <div class="song-meta">
              <p id="song-title">Not playing</p>
            </div>
            <img id="album-cover" src="" alt="Album Cover">
            <button id="spotify-login">🎵 Connect to Spotify</button>
            <p id="user-info">Not logged in</p>
            <p id="user-info" style="display:none;"></p>
          </div>


        <!-- Music Controls -->
        <div class="controls">
            <button id="prev"></button>
            <button id="play"></button>
            <button id="pause" style="display: none;"></button>
            <button id="next"></button>
        </div>

    <!-- Song Progress Bar -->
    <div class="progress-container">
        <span id="current-time">0:00</span>
        <div class="progress-wrapper">
          <input type="range" id="progress-bar" value="0" min="0" max="100">
          <img id="totoro-thumb" src="assets/totoro-icon.png" alt="Totoro">
        </div>
        <span id="total-time">0:00</span>
      </div>
      

        <!-- Navigation Buttons -->
        <div class="navigation">
            <button id="open-playlists" style="color: #000000;">playlists</button> 
            <img id="logout-logo" src="assets/custom_spotify_logo.png" alt="Log out" title="Log out">
        </div>
    </div>


    <script src="renderer.js"></script>
</body>
</html>
