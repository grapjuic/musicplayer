<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Drag area styling */
        .drag-area {
            -webkit-app-region: drag;
            height: 30px;
            width: 100%;
            background-color: transparent;
        }
    </style>
</head>
<body>
    <!-- Custom Drag Area -->
    <div class="drag-area"></div>

    <div id="music-player">
        <!-- <h2>Now Playing</h2> -->
        <div id="now-playing">
            <img id="album-cover" src="" alt="Album Cover">
            <p id="song-title">Not playing</p>
            <button id="spotify-login">🎵 Connect to Spotify</button>
            <p id="user-info">Not logged in</p>
        </div>

        <!-- Music Controls -->
        <div class="controls">
            <button id="prev"></button>
            <button id="play"></button>
            <button id="pause" style="display: none;"></button>
            <button id="next"></button>
        </div>

    <!-- Song Progress Bar -->
    <div class="progress-container">
        <span id="current-time">0:00</span>
        <div class="progress-wrapper">
          <input type="range" id="progress-bar" value="0" min="0" max="100">
          <img id="totoro-thumb" src="assets/totoro-icon.png" alt="Totoro">
        </div>
        <span id="total-time">0:00</span>
      </div>
      
      
     
    
          

        <!-- Navigation Buttons -->
        <div class="navigation">
            <button id="open-playlists">playlists</button>
            <button id="open-themes">themes</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const loginButton = document.getElementById("spotify-login");
            const userInfo = document.getElementById("user-info");

            if (!window.electron) {
                console.error("❌ Electron API not found!");
                return;
            }

            loginButton.addEventListener("click", () => {
                window.electron.loginToSpotify(); // open Spotify login
            });

            // check if user is logged in
            const accessToken = localStorage.getItem("spotifyAccessToken");
            if (accessToken) {
                try {
                    // Fetch user data from Spotify API
                    const response = await fetch("https://api.spotify.com/v1/me", {
                        headers: { "Authorization": `Bearer ${accessToken}` }
                    });

                    if (!response.ok) throw new Error("Failed to fetch user data");

                    const userData = await response.json();
                    userInfo.innerText = `✅ Logged in as ${userData.display_name}`;
                    loginButton.style.display = "none"; // hide login button
                } catch (error) {
                    console.error("Error fetching user data:", error);
                    userInfo.innerText = "❌ Not logged in";
                    loginButton.style.display = "block"; // show login button if error
                }
            } else {
                loginButton.style.display = "block"; // nsure it's visible if not connected
                userInfo.innerText = "❌ Not logged in";
            }
        });
    </script>

    <script src="renderer.js"></script>
</body>
</html>
