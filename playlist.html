<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>playlists</title>

  <!-- 🎨 Custom Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="playlist.css">
</head>
<body>
  <h2>playlists</h2>
  <!-- <p>Select a playlist to start playing:</p> -->
  <div id="playlist-container" class="playlist-grid"></div>

  <button id="back-btn">⬅ Back</button>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      console.log("📜 Playlist page loaded.");
      await fetchPlaylists();

      document.getElementById("back-btn").addEventListener("click", () => {
        if (window.electron && typeof window.electron.goBack === "function") {
          window.electron.goBack(); // ✅ This matches your preload.js
        } else {
          console.warn("window.electron.goBack is not available. Using browser history.");
          window.history.back(); // fallback
        }
      });
    });

    async function fetchPlaylists() {
      let accessToken = localStorage.getItem("spotifyAccessToken");

      if (!accessToken) {
        console.error("No access token found.");
        document.getElementById("playlist-container").innerHTML = "<p>⚠ Please log in to Spotify first.</p>";
        return;
      }

      try {
        const response = await fetch("https://api.spotify.com/v1/me/playlists", {
          headers: { "Authorization": `Bearer ${accessToken}` }
        });

        if (!response.ok) throw new Error("Failed to fetch playlists");

        const data = await response.json();
        displayPlaylists(data.items);
      } catch (error) {
        console.error("Error fetching playlists:", error);
        document.getElementById("playlist-container").innerHTML = "<p>⚠ Failed to load playlists.</p>";
      }
    }

    function displayPlaylists(playlists) {
      const container = document.getElementById("playlist-container");
      container.innerHTML = "";

      if (!playlists || playlists.length === 0) {
        container.innerHTML = "<p>No playlists found.</p>";
        return;
      }

      playlists.forEach(playlist => {
        const div = document.createElement("div");
        div.className = "playlist-card";

        const imageUrl = playlist.images[0]?.url || "default-cover.png";

        div.innerHTML = `
          <img src="${imageUrl}" alt="${playlist.name} cover" />
          <h3>${playlist.name}</h3>
          <button onclick="playPlaylist('${playlist.id}')">▶ Play</button>
        `;

        container.appendChild(div);
      });
    }

    async function playPlaylist(playlistId) {
      let accessToken = localStorage.getItem("spotifyAccessToken");

      try {
        const response = await fetch("https://api.spotify.com/v1/me/player/play", {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${accessToken}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ context_uri: `spotify:playlist:${playlistId}` })
        });

        if (!response.ok) throw new Error("Failed to start playlist playback");
        console.log("🎵 Now playing playlist:", playlistId);
      } catch (error) {
        console.error("Error playing playlist:", error);
      }
    }
  </script>
</body>
</html>
